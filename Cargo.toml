[workspace]
members = ["crates/*", "servers/*"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
repository = "https://github.com/O2un/O2unMCP"

[workspace.dependencies]
o2un-mcp-core = { path = "crates/o2un-mcp-core" }

# rmcp는 3.x 안에서도 API가 바뀐다. 올릴 때는 고정 태그의 예제를 다시 읽는다.
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
